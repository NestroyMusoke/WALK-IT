<text x="30" y="213.0" font-family="Arial" font-size="5" fill="black">Check bar: 100 mm</text>
<text x="30" y="229.0" font-family="Arial" font-weight="bold" font-size="6" fill="black">WALK IT · START MARKER</text>
<text x="30" y="238.0" font-family="Arial" font-size="4.5" fill="black">PRINT AT 100% SCALE. Turn off Fit to page.</text>
<text x="30" y="246.0" font-family="Arial" font-size="4.5" fill="black">Keep the full black square flat and evenly lit.</text>
<text x="30" y="254.0" font-family="Arial" font-size="4.5" fill="black">PANEL 2 OF 2. Tape the LEFT white border to the other panel.</text>
<text x="30" y="262.0" font-family="Arial" font-size="4.5" fill="black">Fold to 90 degrees and stand facing the crease: both squares must be visible at once.</text>
<text x="30" y="270.0" font-family="Arial" font-size="4.5" fill="black">Never cut the 25 mm white border - without it ArUco finds nothing.</text>
